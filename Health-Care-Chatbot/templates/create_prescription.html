{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-9">
    <h1 class="h3 mb-3">Create Prescription</h1>
    <div class="alert alert-warning" role="alert">
      Any generated text is only a draft and must be reviewed by a licensed healthcare professional.
    </div>
    {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('create_prescription') }}">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="patient_name">Patient name</label>
          <input class="form-control" id="patient_name" name="patient_name" required value="{{ patient_name|default('') }}">
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label" for="age">Age</label>
          <input class="form-control" id="age" name="age" value="{{ age|default('') }}">
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label" for="gender">Gender</label>
          <input class="form-control" id="gender" name="gender" value="{{ gender|default('') }}">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="doctor_name">Prescribing physician</label>
        <input class="form-control" id="doctor_name" name="doctor_name" value="{{ doctor_name|default('') }}">
      </div>
      <div class="mb-3">
        <label class="form-label" for="symptoms">Clinical presentation / symptoms</label>
        <textarea class="form-control" id="symptoms" name="symptoms" rows="3">{{ symptoms|default('') }}</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label" for="medications">Medications</label>
        <textarea class="form-control" id="medications" name="medications" rows="3">{{ medications|default('') }}</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label" for="diagnosis">Diagnosis</label>
        <textarea class="form-control" id="diagnosis" name="diagnosis" rows="2">{{ diagnosis|default('') }}</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label" for="instructions">Instructions</label>
        <textarea class="form-control" id="instructions" name="instructions" rows="3">{{ instructions|default('') }}</textarea>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="ai_generate" name="ai_generate" value="1">
        <label class="form-check-label" for="ai_generate">Generate an AI draft from the symptoms (must be reviewed)</label>
      </div>
      <button class="btn btn-primary" type="submit">Create prescription</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('generated_prescriptions') }}">View generated prescriptions</a>
    </form>
  </div>
</div>
{% endblock %}
